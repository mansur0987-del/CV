name: Validate portfolio and SEO

on:
  push:
    branches: [dev]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build static website
        run: npm run build
      - name: Validate exported SEO
        run: node scripts/check-seo.mjs
      - name: Audit installed dependency tree
        run: npm audit --audit-level=high
